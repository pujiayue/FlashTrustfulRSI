[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "flashtrustfulrsi"
version = "0.4.0a2"
description = "Auditable trust evaluation adapters for recursive self-improvement research"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6,<7"]
license = "Apache-2.0"
[project.scripts]
flashtrustfulrsi = "flashtrustfulrsi.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.data-files]
"share/flashtrustfulrsi" = ["configs/catalog.json", "configs/flashrsi-source.lock.json", "configs/misevolution-source-subset.lock.json"]
